model:
  default: gpt-5.4-mini
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex

providers: {}
fallback_providers: []
credential_pool_strategies: {}
toolsets:
  - hermes-cli

agent:
  max_turns: 60
  gateway_timeout: 1800
  restart_drain_timeout: 180
  api_max_retries: 3
  tool_use_enforcement: auto
  disabled_toolsets: []
  verbose: false
  reasoning_effort: medium

terminal:
  # In Coolify, local means "inside the Hermes container". Docker backend
  # needs Docker socket access and is intentionally not enabled by default.
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  persistent_shell: true

web:
  backend: firecrawl
  use_gateway: false

browser:
  engine: auto
  cloud_provider: local
  use_gateway: false
  allow_private_urls: false

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  provider: ""

display:
  compact: false
  personality: helpful
  busy_input_mode: interrupt

approvals:
  mode: manual
  timeout: 60
  cron_mode: deny
  mcp_reload_confirm: true
  destructive_slash_confirm: true

cron:
  wrap_response: true
  max_parallel_jobs: null

kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 60
  failure_limit: 2

security:
  allow_private_urls: false
  redact_secrets: true
  tirith_enabled: true
  tirith_fail_open: true

platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - file
    - image_gen
    - kanban
    - memory
    - messaging
    - session_search
    - skills
    - spotify
    - terminal
    - todo
    - tts
    - vision
    - web
  whatsapp:
    - browser
    - clarify
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - file
    - image_gen
    - kanban
    - memory
    - messaging
    - session_search
    - skills
    - spotify
    - terminal
    - todo
    - tts
    - vision
    - web
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  slack:
    - hermes-slack

known_plugin_toolsets:
  cli:
    - spotify
  whatsapp:
    - spotify

image_gen:
  provider: openai-codex
  use_gateway: false
  model: gpt-image-2-medium

_config_version: 23
group_sessions_per_user: true
streaming:
  enabled: false
