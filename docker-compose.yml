services:
  hermes-init:
    image: alpine:3.20
    restart: "no"
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
    volumes:
      - hermes-data:/opt/data
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        mkdir -p /opt/data/logs /opt/data/whatsapp /opt/data/sessions /opt/data/audio_cache /opt/data/image_cache /opt/data/bin /opt/data/.hermes/skills/firefly /opt/data/skills/firefly
        if [ ! -f /opt/data/config.yaml ]; then
          sed 's/^        //' > /opt/data/config.yaml <<'EOF'
        model:
          default: gpt-5.4-mini
          provider: openai-codex
          base_url: https://chatgpt.com/backend-api/codex

        providers: {}
        fallback_providers: []
        credential_pool_strategies: {}
        toolsets:
          - hermes-cli

        agent:
          max_turns: 60
          gateway_timeout: 1800
          restart_drain_timeout: 180
          api_max_retries: 3
          tool_use_enforcement: auto
          disabled_toolsets: []
          verbose: false
          reasoning_effort: medium

        terminal:
          backend: local
          cwd: /opt/data/workspace
          timeout: 180
          persistent_shell: true

        web:
          backend: firecrawl
          use_gateway: false

        browser:
          engine: auto
          cloud_provider: local
          use_gateway: false
          allow_private_urls: false

        memory:
          memory_enabled: true
          user_profile_enabled: true
          memory_char_limit: 2200
          user_char_limit: 1375
          provider: ""

        display:
          compact: false
          personality: helpful
          busy_input_mode: interrupt

        approvals:
          mode: manual
          timeout: 60
          cron_mode: deny
          mcp_reload_confirm: true
          destructive_slash_confirm: true

        cron:
          wrap_response: true
          max_parallel_jobs: null

        kanban:
          dispatch_in_gateway: true
          dispatch_interval_seconds: 60
          failure_limit: 2

        security:
          allow_private_urls: false
          redact_secrets: true
          tirith_enabled: true
          tirith_fail_open: true

        platform_toolsets:
          cli:
            - browser
            - clarify
            - code_execution
            - computer_use
            - cronjob
            - delegation
            - file
            - image_gen
            - kanban
            - memory
            - messaging
            - session_search
            - skills
            - spotify
            - terminal
            - todo
            - tts
            - vision
            - web
          whatsapp:
            - browser
            - clarify
            - code_execution
            - computer_use
            - cronjob
            - delegation
            - file
            - image_gen
            - kanban
            - memory
            - messaging
            - session_search
            - skills
            - spotify
            - terminal
            - todo
            - tts
            - vision
            - web
          telegram:
            - hermes-telegram
          discord:
            - hermes-discord
          slack:
            - hermes-slack

        known_plugin_toolsets:
          cli:
            - spotify
          whatsapp:
            - spotify

        image_gen:
          provider: openai-codex
          use_gateway: false
          model: gpt-image-2-medium

        _config_version: 23
        group_sessions_per_user: true
        streaming:
          enabled: false
        EOF
        fi
        if [ ! -f /opt/data/.env ]; then
          sed 's/^        //' > /opt/data/.env <<'EOF'
        # Fill values in Coolify's persistent volume, not in git.

        # LLM provider auth:
        # OPENROUTER_API_KEY=
        # GOOGLE_API_KEY=
        # GEMINI_API_KEY=

        HERMES_SPOTIFY_CLIENT_ID=
        HERMES_SPOTIFY_REDIRECT_URI=http://127.0.0.1:43827/spotify/callback

        FIREFLY_BASE_URL=
        FIREFLY_TOKEN=

        # Optional API server. Do not expose without a strong key and proxy auth.
        # API_SERVER_HOST=0.0.0.0
        # API_SERVER_KEY=

        # Messaging platform secrets. Prefer Coolify secrets/env UI for these.
        # TELEGRAM_BOT_TOKEN=
        # DISCORD_BOT_TOKEN=
        # SLACK_BOT_TOKEN=
        EOF
        fi
        cat > /opt/data/bin/firefly <<'EOF'
        #!/usr/bin/env python3
        import argparse
        import json
        import os
        import urllib.error
        import urllib.parse
        import urllib.request

        def env(name):
            value = os.environ.get(name, "").strip()
            if not value:
                raise SystemExit(f"Missing {name}. Set it in Coolify environment variables and redeploy.")
            return value

        def request(method, path, body=None, query=None):
            base_url = env("FIREFLY_BASE_URL").rstrip("/")
            token = env("FIREFLY_TOKEN")
            if query:
                path = f"{path}?{urllib.parse.urlencode(query)}"
            data = None
            headers = {
                "Accept": "application/vnd.api+json",
                "Authorization": f"Bearer {token}",
                "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) Hermes-Firefly/1.0",
            }
            if body is not None:
                data = json.dumps(body).encode("utf-8")
                headers["Content-Type"] = "application/json"
            req = urllib.request.Request(f"{base_url}/api/v1{path}", data=data, headers=headers, method=method)
            try:
                with urllib.request.urlopen(req, timeout=30) as res:
                    payload = res.read().decode("utf-8")
                    return json.loads(payload) if payload else {}
            except urllib.error.HTTPError as exc:
                details = exc.read().decode("utf-8", errors="replace")
                raise SystemExit(f"Firefly API error {exc.code}: {details}") from exc

        def compact(resource):
            data = resource.get("data", resource)
            if isinstance(data, list):
                return [{"id": item.get("id"), **item.get("attributes", {})} for item in data]
            if isinstance(data, dict):
                return {"id": data.get("id"), **data.get("attributes", {})}
            return resource

        def main():
            parser = argparse.ArgumentParser(description="Firefly III helper for Hermes")
            sub = parser.add_subparsers(dest="cmd", required=True)

            sub.add_parser("about")
            sub.add_parser("accounts")
            tx = sub.add_parser("transactions")
            tx.add_argument("--start")
            tx.add_argument("--end")
            tx.add_argument("--limit", default="25")

            create = sub.add_parser("create-withdrawal")
            create.add_argument("--amount", required=True)
            create.add_argument("--description", required=True)
            create.add_argument("--source", required=True, help="Source account name")
            create.add_argument("--destination", required=True, help="Expense account/category name")
            create.add_argument("--date", help="YYYY-MM-DD")
            create.add_argument("--category")
            create.add_argument("--notes")

            args = parser.parse_args()
            if args.cmd == "about":
                result = request("GET", "/about")
            elif args.cmd == "accounts":
                result = compact(request("GET", "/accounts", query={"limit": 200}))
            elif args.cmd == "transactions":
                query = {"limit": args.limit}
                if args.start:
                    query["start"] = args.start
                if args.end:
                    query["end"] = args.end
                result = compact(request("GET", "/transactions", query=query))
            elif args.cmd == "create-withdrawal":
                tx = {
                    "type": "withdrawal",
                    "amount": args.amount,
                    "description": args.description,
                    "source_name": args.source,
                    "destination_name": args.destination,
                }
                if args.date:
                    tx["date"] = args.date
                if args.category:
                    tx["category_name"] = args.category
                if args.notes:
                    tx["notes"] = args.notes
                result = compact(request("POST", "/transactions", {"transactions": [tx]}))
            else:
                raise SystemExit("unknown command")
            print(json.dumps(result, ensure_ascii=False, indent=2))

        if __name__ == "__main__":
            main()
        EOF
        chmod 700 /opt/data/bin/firefly
        sed 's/^        //' > /opt/data/.hermes/skills/firefly/SKILL.md <<'EOF'
        ---
        name: firefly
        description: Use Firefly III for budgets, balances, expenses, transactions, and monthly finance summaries. Trigger when user mentions Firefly, gastos, finanzas, presupuesto, cuentas, balances, ingresos, egresos, or registering an expense.
        ---

        # Firefly III

        Use `/opt/data/bin/firefly` to interact with Firefly III. Credentials come only from environment variables:

        - `FIREFLY_BASE_URL`
        - `FIREFLY_TOKEN`

        Never print `FIREFLY_TOKEN`. If credentials are missing, tell user to set them in Coolify environment variables and redeploy.

        Common commands:

        ```bash
        /opt/data/bin/firefly about
        /opt/data/bin/firefly accounts
        /opt/data/bin/firefly transactions --start YYYY-MM-DD --end YYYY-MM-DD --limit 50
        /opt/data/bin/firefly create-withdrawal --amount "45000" --description "Supermercado" --source "Cuenta" --destination "Supermercado" --category "Comida" --date YYYY-MM-DD
        ```

        When creating expenses, confirm ambiguous fields first: source account, amount, description, category, and date. For read-only summaries, fetch transactions then summarize totals by category or account.
        EOF
        cp /opt/data/.hermes/skills/firefly/SKILL.md /opt/data/skills/firefly/SKILL.md
        chown -R "$${HERMES_UID}:$${HERMES_GID}" /opt/data
        chmod -R u+rwX,go-rwx /opt/data

  hermes:
    build:
      context: https://github.com/NousResearch/hermes-agent.git
    restart: unless-stopped
    depends_on:
      hermes-init:
        condition: service_completed_successfully
    volumes:
      - hermes-data:/opt/data
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      HERMES_HOME: /opt/data
      TZ: ${TZ:-America/Asuncion}
      FIREFLY_BASE_URL: ${FIREFLY_BASE_URL:-}
      FIREFLY_TOKEN: ${FIREFLY_TOKEN:-}
    command: ["gateway", "run"]

  # Optional dashboard. Enable only behind Coolify auth/proxy.
  # hermes-dashboard:
  #   build:
  #     context: https://github.com/NousResearch/hermes-agent.git
  #   restart: unless-stopped
  #   depends_on:
  #     hermes:
  #       condition: service_started
  #   volumes:
  #     - hermes-data:/opt/data
  #   environment:
  #     HERMES_UID: ${HERMES_UID:-10000}
  #     HERMES_GID: ${HERMES_GID:-10000}
  #     HERMES_HOME: /opt/data
  #     TZ: ${TZ:-America/Asuncion}
  #   command: ["dashboard", "--host", "0.0.0.0", "--no-open"]
  #   ports:
  #     - "9119:9119"

volumes:
  hermes-data:
